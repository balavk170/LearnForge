services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-qwen2.5:1.5b}
      DATABASE_URL: sqlite:////data/learnforge.db
      FRONTEND_ORIGINS: http://localhost:5173
    volumes:
      - learnforge-data:/data
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
volumes:
  learnforge-data:
